# @eforge/cf-core — 自动化发布流水线（GitHub Packages 私有包）
#
# 自动触发：
#   推送 tags 匹配 v* 时 → 运行测试 → 构建 → 发布到 GitHub Packages
#   推送 main 分支时 → 仅运行测试 + 检查
#
# 前提条件：无需额外配置，使用 GitHub Actions 内置的 GITHUB_TOKEN
#
# 使用方式：
#   git tag v0.2.0
#   git push origin v0.2.0

name: Publish @eforge/cf-core

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ── 全量检查（每次 PR / push main 都跑） ──
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cf-core
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm run type-check
      - run: pnpm test

  # ── GitHub Packages 发布（仅 tag push 时执行） ──
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cf-core
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Configure pnpm for GitHub Packages
        run: |
          echo "@eforge:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm run build
      - run: pnpm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── GitHub Release（仅 tag push 时执行） ──
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
