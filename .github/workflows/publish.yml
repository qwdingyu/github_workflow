# @eforge/cf-core — 自动化发布流水线
#
# 自动触发：
#   推送 tags 匹配 v* 时 → 运行测试 → 构建 → 发布到 npm
#   推送 main 分支时 → 仅运行测试 + 检查
#
# 前提条件（在 GitHub repo Settings → Secrets and variables → Actions 中设置）：
#   NPM_TOKEN: npm 自动化访问令牌（https://npmjs.com/settings/<org>/tokens）
#
# 使用方式：
#   git tag v0.2.0
#   git push origin v0.2.0

name: Publish @eforge/cf-core

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ── 全量检查（每次 PR / push main 都跑） ──
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cf-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: packages/cf-core/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm test

  # ── npm 发布（仅 tag push 时执行） ──
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cf-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: packages/cf-core/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── GitHub Release（仅 tag push 时执行） ──
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
