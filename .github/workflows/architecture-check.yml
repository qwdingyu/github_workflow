name: 架构合规性检查
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行架构验证
        run: node scripts/validate-architecture.mjs

      - name: 类型检查
        run: pnpm -w packages/cf-core run type-check
        continue-on-error: true
