name: Deploy AcctBox to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'acctbox/**'
      - '.github/workflows/deploy-acctbox.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        default: 'production'
        type: choice
        options:
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acctbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: acctbox/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: acctbox
          command: deploy

      - name: Verify deployment
        run: |
          echo "✅ acctbox deployed to Cloudflare Workers"
          echo "📎 workers.dev: https://acctbox.mailforwdy.workers.dev"
          echo "📎 custom domain: https://acctbox.eforge.xyz"
