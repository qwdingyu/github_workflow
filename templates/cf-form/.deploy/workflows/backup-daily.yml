# ═══════════════════════════════════════════════════════════════════════════════
# 每日数据库备份（Turso → GitHub Artifacts）
#
# 每日凌晨 3:00 UTC 自动全量备份，保留 7 天。
# ═══════════════════════════════════════════════════════════════════════════════
name: Daily Database Backup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install libsql client
        run: npm install @libsql/client 2>/dev/null || true

      - name: Export Turso database
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: |
          STAMP=$(date +%Y%m%d_%H%M%S)
          mkdir -p backups

          node -e "
            const { createClient } = require('@libsql/client');
            const fs = require('fs');
            const c = createClient({ url: process.env.TURSO_URL, authToken: process.env.TURSO_TOKEN });
            (async () => {
              const tables = await c.execute(\"SELECT name FROM sqlite_master WHERE type='table'\");
              let sql = '-- Backup: ' + new Date().toISOString() + '\n\n';
              for (const row of tables.rows) {
                const data = await c.execute('SELECT * FROM ' + row.name);
                for (const r of data.rows) {
                  const vals = Object.values(r).map(v =>
                    v === null ? 'NULL' : typeof v === 'number' ? v : \"'\" + String(v).replace(/'/g, \"''\") + \"'\");
                  sql += 'INSERT INTO ' + row.name + ' VALUES (' + vals.join(',') + ');\n';
                }
              }
              fs.writeFileSync('backups/turso_' + process.env.STAMP + '.sql', sql);
              console.log('✅ Backup saved: backups/turso_' + process.env.STAMP + '.sql');
            })();
          " 2>/dev/null || {
            echo "⚠️ Node.js 备份失败，尝试 Turso CLI..."
            curl -sSfL https://get.tur.so/install.sh | bash 2>/dev/null
            export PATH="$HOME/.turso:$PATH"
            turso db dump --url "$TURSO_URL" --auth-token "$TURSO_TOKEN" --output "backups/turso_${STAMP}.sql" 2>/dev/null || echo "⚠️ Turso CLI 备份也失败"
          }

          echo "STAMP=${STAMP}" >> $GITHUB_ENV
          ls -lh backups/ 2>/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turso-backup-${{ env.STAMP }}
          path: backups/*.sql
          retention-days: 7
          compression-level: 9
        if: always()

      - name: Summary
        run: |
          echo "## 💾 数据库备份报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 时间 | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| 保留 | 7 天 |" >> $GITHUB_STEP_SUMMARY
          if ls backups/*.sql 1>/dev/null 2>&1; then
            SIZE=$(ls -lh backups/*.sql | awk '{print $5}')
            echo "| 大小 | ${SIZE} |" >> $GITHUB_STEP_SUMMARY
            echo "| 状态 | ✅ 成功 |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 状态 | ⚠️ 失败 |" >> $GITHUB_STEP_SUMMARY
          fi
