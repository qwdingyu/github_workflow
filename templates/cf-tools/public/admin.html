<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CF Tools — 管理后台</title>

  <!-- Element Plus（CDN） -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <link rel="stylesheet" href="https://unpkg.com/element-plus/theme-chalk/dark/css-vars.css" />

  <style>
    /* ═══ 暗色主题基础 ═══ */
    html { color-scheme: dark; }
    body {
      margin: 0;
      background: #0f1117;
      color: #e4e6eb;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
    }

    .app-header {
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0;
    }

    .app-header h1 span { color: #6366f1; }

    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    /* ═══ 统计卡片 ═══ */
    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 20px;
    }

    .stat-card .label {
      font-size: 0.825rem;
      color: #8b8fa3;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 1.75rem;
      font-weight: 700;
      color: #6366f1;
    }

    /* ═══ 登录遮罩 ═══ */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: #0f1117;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .login-box {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 40px;
      width: 380px;
    }

    .login-box h2 {
      margin: 0 0 24px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- ═══ 登录界面 ═══ -->
    <div v-if="!authenticated" class="login-overlay">
      <div class="login-box">
        <h2><span style="color:#6366f1">CF</span> Tools 管理后台</h2>
        <el-form @submit.prevent="login">
          <el-form-item label="管理 Token">
            <el-input
              v-model="adminToken"
              type="password"
              placeholder="请输入 ADMIN_TOKEN"
              show-password
              @keyup.enter="login"
            />
          </el-form-item>
          <el-button type="primary" @click="login" :loading="loading" style="width:100%">
            登录
          </el-button>
        </el-form>
      </div>
    </div>

    <!-- ═══ 管理界面 ═══ -->
    <template v-else>
      <!-- 头部 -->
      <header class="app-header">
        <h1><span>CF</span> Tools 管理后台</h1>
        <div>
          <el-button text @click="logout">退出</el-button>
          <el-button text tag="a" href="/" style="color:#8b8fa3">返回前台</el-button>
        </div>
      </header>

      <div class="app-container">
        <!-- 统计卡片 -->
        <div class="stat-cards">
          <div class="stat-card">
            <div class="label">用户总数</div>
            <div class="value">{{ stats.users }}</div>
          </div>
          <div class="stat-card">
            <div class="label">工具总数</div>
            <div class="value">{{ stats.tools }}</div>
          </div>
          <div class="stat-card">
            <div class="label">总使用次数</div>
            <div class="value">{{ stats.totalUsage }}</div>
          </div>
          <div class="stat-card">
            <div class="label">今日使用</div>
            <div class="value">{{ stats.todayUsage }}</div>
          </div>
        </div>

        <!-- Tab 切换 -->
        <el-tabs v-model="activeTab">
          <!-- ═══ 用户管理 ═══ -->
          <el-tab-pane label="用户管理" name="users">
            <el-table :data="userList" stripe style="width: 100%" v-loading="loading">
              <el-table-column prop="email" label="邮箱" min-width="200" />
              <el-table-column prop="displayName" label="昵称" width="120" />
              <el-table-column prop="role" label="角色" width="100">
                <template #default="{ row }">
                  <el-tag :type="row.role === 'admin' ? 'danger' : 'info'" size="small">
                    {{ row.role }}
                  </el-tag>
                </template>
              </el-table-column>
              <el-table-column prop="enabled" label="状态" width="80">
                <template #default="{ row }">
                  <el-tag :type="row.enabled ? 'success' : 'danger'" size="small">
                    {{ row.enabled ? '启用' : '禁用' }}
                  </el-tag>
                </template>
              </el-table-column>
              <el-table-column prop="createdAt" label="注册时间" width="170" />
              <el-table-column label="操作" width="200" fixed="right">
                <template #default="{ row }">
                  <el-button
                    size="small"
                    :type="row.enabled ? 'warning' : 'success'"
                    @click="toggleUser(row)"
                  >
                    {{ row.enabled ? '禁用' : '启用' }}
                  </el-button>
                  <el-popconfirm
                    title="确定删除此用户?"
                    @confirm="deleteUser(row.id)"
                  >
                    <template #reference>
                      <el-button size="small" type="danger">删除</el-button>
                    </template>
                  </el-popconfirm>
                </template>
              </el-table-column>
            </el-table>

            <el-pagination
              v-if="userPagination.total > 0"
              style="margin-top: 16px; justify-content: center;"
              layout="prev, pager, next"
              :total="userPagination.total"
              :page-size="userPagination.pageSize"
              v-model:current-page="userPagination.page"
              @current-change="loadUsers"
            />
          </el-tab-pane>

          <!-- ═══ 工具管理 ═══ -->
          <el-tab-pane label="工具管理" name="tools">
            <el-table :data="toolList" stripe style="width: 100%" v-loading="loading">
              <el-table-column prop="icon" label="图标" width="60" align="center">
                <template #default="{ row }">
                  <span style="font-size: 1.3rem;">{{ row.icon || '#' }}</span>
                </template>
              </el-table-column>
              <el-table-column prop="name" label="名称" width="160" />
              <el-table-column prop="slug" label="Slug" width="140" />
              <el-table-column prop="description" label="描述" min-width="200" />
              <el-table-column prop="category" label="分类" width="100" />
              <el-table-column prop="enabled" label="状态" width="80">
                <template #default="{ row }">
                  <el-tag :type="row.enabled ? 'success' : 'danger'" size="small">
                    {{ row.enabled ? '启用' : '禁用' }}
                  </el-tag>
                </template>
              </el-table-column>
              <el-table-column label="操作" width="120" fixed="right">
                <template #default="{ row }">
                  <el-button
                    size="small"
                    :type="row.enabled ? 'warning' : 'success'"
                    @click="toggleTool(row)"
                  >
                    {{ row.enabled ? '禁用' : '启用' }}
                  </el-button>
                </template>
              </el-table-column>
            </el-table>
          </el-tab-pane>

          <!-- ═══ 使用统计 ═══ -->
          <el-tab-pane label="使用统计" name="stats">
            <div v-if="toolStats.length">
              <el-table :data="toolStats" stripe style="width: 100%; max-width: 600px;">
                <el-table-column prop="slug" label="工具" />
                <el-table-column prop="count" label="最近 7 天使用量" width="180" />
              </el-table>
            </div>

            <h3 style="margin: 24px 0 12px;">使用日志</h3>
            <el-table :data="usageLogs" stripe style="width: 100%" v-loading="loading">
              <el-table-column prop="toolSlug" label="工具" width="140" />
              <el-table-column prop="userId" label="用户 ID" width="280">
                <template #default="{ row }">
                  {{ row.userId || '匿名' }}
                </template>
              </el-table-column>
              <el-table-column prop="status" label="状态" width="80">
                <template #default="{ row }">
                  <el-tag :type="row.status === 'success' ? 'success' : 'danger'" size="small">
                    {{ row.status }}
                  </el-tag>
                </template>
              </el-table-column>
              <el-table-column prop="durationMs" label="耗时" width="80">
                <template #default="{ row }">{{ row.durationMs }}ms</template>
              </el-table-column>
              <el-table-column prop="createdAt" label="时间" width="180" />
              <el-table-column prop="errorMessage" label="错误信息" min-width="200">
                <template #default="{ row }">
                  <span style="color: #ef4444;">{{ row.errorMessage || '-' }}</span>
                </template>
              </el-table-column>
            </el-table>
          </el-tab-pane>
        </el-tabs>
      </div>
    </template>
  </div>

  <!-- Vue 3 + Element Plus（CDN） -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>

  <script>
    const { createApp, ref, reactive, onMounted, watch } = Vue;

    const app = createApp({
      setup() {
        // ── 认证状态 ──
        const authenticated = ref(false);
        const adminToken = ref(localStorage.getItem('adminToken') || '');
        const loading = ref(false);
        const activeTab = ref('users');

        // ── 统计数据 ──
        const stats = reactive({ users: 0, tools: 0, totalUsage: 0, todayUsage: 0 });
        const toolStats = ref([]);

        // ── 用户管理 ──
        const userList = ref([]);
        const userPagination = reactive({ page: 1, pageSize: 20, total: 0 });

        // ── 工具管理 ──
        const toolList = ref([]);

        // ── 使用日志 ──
        const usageLogs = ref([]);

        // ── API 调用 ──
        async function api(path, options = {}) {
          const headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${adminToken.value}`,
          };
          const res = await fetch(`/api${path}`, { ...options, headers });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || '请求失败');
          return data;
        }

        // ── 登录 ──
        async function login() {
          if (!adminToken.value) return;
          loading.value = true;
          try {
            // 用 admin token 请求 stats 接口验证
            await api('/admin/stats');
            authenticated.value = true;
            localStorage.setItem('adminToken', adminToken.value);
            loadAll();
          } catch (err) {
            ElementPlus.ElMessage.error('认证失败: ' + err.message);
          } finally {
            loading.value = false;
          }
        }

        function logout() {
          authenticated.value = false;
          adminToken.value = '';
          localStorage.removeItem('adminToken');
        }

        // ── 加载所有数据 ──
        async function loadAll() {
          await Promise.all([loadStats(), loadUsers(), loadTools(), loadUsageLogs()]);
        }

        async function loadStats() {
          try {
            const data = await api('/admin/stats');
            Object.assign(stats, {
              users: data.users,
              tools: data.tools,
              totalUsage: data.totalUsage,
              todayUsage: data.todayUsage,
            });
            toolStats.value = data.toolStats || [];
          } catch (err) {
            console.error('loadStats', err);
          }
        }

        async function loadUsers() {
          loading.value = true;
          try {
            const data = await api(`/admin/users?page=${userPagination.page}`);
            userList.value = data.users || [];
            Object.assign(userPagination, data.pagination || {});
          } catch (err) {
            ElementPlus.ElMessage.error('加载用户失败: ' + err.message);
          } finally {
            loading.value = false;
          }
        }

        async function loadTools() {
          try {
            const data = await api('/admin/tools');
            toolList.value = data.tools || [];
          } catch (err) {
            console.error('loadTools', err);
          }
        }

        async function loadUsageLogs() {
          try {
            const data = await api('/admin/stats/usage?pageSize=50');
            usageLogs.value = data.logs || [];
          } catch (err) {
            console.error('loadUsageLogs', err);
          }
        }

        // ── 用户操作 ──
        async function toggleUser(user) {
          try {
            await api(`/admin/users/${user.id}`, {
              method: 'PATCH',
              body: JSON.stringify({ enabled: user.enabled ? 0 : 1 }),
            });
            ElementPlus.ElMessage.success(user.enabled ? '已禁用' : '已启用');
            loadUsers();
          } catch (err) {
            ElementPlus.ElMessage.error(err.message);
          }
        }

        async function deleteUser(id) {
          try {
            await api(`/admin/users/${id}`, { method: 'DELETE' });
            ElementPlus.ElMessage.success('已删除');
            loadUsers();
          } catch (err) {
            ElementPlus.ElMessage.error(err.message);
          }
        }

        // ── 工具操作 ──
        async function toggleTool(tool) {
          try {
            await api(`/admin/tools/${tool.id}`, {
              method: 'PATCH',
              body: JSON.stringify({ enabled: tool.enabled ? 0 : 1 }),
            });
            ElementPlus.ElMessage.success(tool.enabled ? '已禁用' : '已启用');
            loadTools();
          } catch (err) {
            ElementPlus.ElMessage.error(err.message);
          }
        }

        // ── Tab 切换时加载数据 ──
        watch(activeTab, (tab) => {
          if (tab === 'stats') loadUsageLogs();
        });

        // ── 初始化：检查本地 token ──
        onMounted(async () => {
          if (adminToken.value) {
            try {
              await api('/admin/stats');
              authenticated.value = true;
              loadAll();
            } catch {
              // token 无效，显示登录界面
            }
          }
        });

        return {
          authenticated, adminToken, loading, activeTab,
          stats, toolStats,
          userList, userPagination,
          toolList, usageLogs,
          login, logout,
          loadUsers, toggleUser, deleteUser,
          toggleTool,
        };
      },
    });

    app.use(ElementPlus);
    app.mount('#app');
  </script>

</body>
</html>
