# ═══════════════════════════════════════════════════════════════════════════════
# cf-tools CI/CD 部署流水线
#
# 触发条件：push 到 main 分支 / 手动触发
# 流程：install → type-check → test → migrate → deploy → smoke
#
# 需要设置的 GitHub Secrets：
#   CLOUDFLARE_API_TOKEN  — Cloudflare API Token
#   TURSO_URL             — Turso 数据库 URL
#   TURSO_TOKEN           — Turso 数据库 Token
#   WRANGLER_SECRETS_JSON — Wrangler Secrets（JSON 格式，可选）
#
# 需要设置的 GitHub Variables：
#   APP_ORIGIN            — 站点域名（如 https://tools.example.com）
# ═══════════════════════════════════════════════════════════════════════════════
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'migrations/**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── 安装依赖 ──
      - name: Install dependencies
        run: npm ci

      # ── 类型检查 ──
      - name: Type check
        run: npm run type-check

      # ── 运行测试 ──
      - name: Run tests
        run: npm test

      # ── 数据库迁移 ──
      - name: Apply database migrations
        run: npm run db:migrate
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        continue-on-error: true

      # ── 部署到 Cloudflare Workers ──
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # ── 推送 Secrets（可选） ──
      - name: Push secrets
        if: ${{ secrets.WRANGLER_SECRETS_JSON != '' }}
        run: |
          echo "${{ secrets.WRANGLER_SECRETS_JSON }}" | npx wrangler secret bulk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        continue-on-error: true

      # ── 冒烟测试 ──
      - name: Smoke test (readonly)
        run: npm run smoke:readonly
        env:
          BASE_URL: ${{ vars.APP_ORIGIN || format('https://{0}.workers.dev', github.event.repository.name) }}

      # ── 部署摘要 ──
      - name: Deploy summary
        if: always()
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
