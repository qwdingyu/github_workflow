# cf-auth nginx 反代
# 生产 VPS 当前配置基线：auth.eforge.xyz -> nginx :443 -> 127.0.0.1:8788
# 注意：location 内必须重复 proxy_set_header。nginx 一旦在 location 中出现
# 任意 proxy_set_header，就不会继承 server 级 proxy_set_header。

upstream cf_auth_node {
    server 127.0.0.1:8788;
    keepalive 32;
}

server {
    server_name 38.47.198.72 auth.eforge.xyz;

    # 真实客户端 IP（Node 侧需 TRUST_PROXY_HEADERS=true）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 2m;

    location / {
        proxy_pass http://cf_auth_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/auth.eforge.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/auth.eforge.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = auth.eforge.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name auth.eforge.xyz;
    return 301 https://$server_name$request_uri;
}
