# ═══════════════════════════════════════════════════════════════════════════════
# 标准化 CI/CD 部署流水线（支持三种部署模式）
#
# 模板变量（由 06-setup-github.sh 替换）：
#   {{WORKER_NAME}}  — Worker 名称
#   {{PROJECT_NAME}} — 项目名
#   {{DOMAIN}}       — 自定义域名
#
# 部署模式（由 GitHub Variable DEPLOY_MODE 控制）：
#   workers  — Cloudflare Workers + Static Assets（默认）
#   pages    — Cloudflare Pages（纯静态站）
#   hybrid   — Workers + Pages 混合模式
# ═══════════════════════════════════════════════════════════════════════════════
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'src/**'
      - 'frontend/**'
      - 'public/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check
        continue-on-error: true

      - name: Unit tests
        run: npm test
        continue-on-error: true

      # ── 构建前端（可选） ──────────────────────────────────────────────
      - name: Build frontend
        run: |
          if grep -q '"build:frontend"' package.json 2>/dev/null; then
            npm run build:frontend
          elif grep -q '"build"' package.json 2>/dev/null && [ "${{ vars.DEPLOY_MODE }}" = "pages" ]; then
            npm run build
          else
            echo "No frontend build step"
          fi

      # ── SEO 页面生成（仅 pages 模式） ─────────────────────────────────
      - name: Generate SEO pages
        if: ${{ vars.DEPLOY_MODE == 'pages' }}
        run: |
          if grep -q '"generate:seo"' package.json 2>/dev/null; then
            npm run generate:seo
          else
            echo "No SEO generation step"
          fi

      # ── 数据库迁移（workers/hybrid 模式） ──────────────────────────────
      - name: Apply database migrations
        if: ${{ vars.DEPLOY_MODE != 'pages' }}
        run: |
          if [ -f "scripts/migrate.mjs" ]; then
            node scripts/migrate.mjs
          elif [ -d "migrations" ]; then
            echo "Running migrations from migrations/ directory"
            node -e "
              const { createClient } = require('@libsql/client');
              const fs = require('fs');
              const c = createClient({ url: process.env.TURSO_URL, authToken: process.env.TURSO_TOKEN });
              const files = fs.readdirSync('migrations').filter(f => f.endsWith('.sql')).sort();
              (async () => {
                for (const f of files) {
                  const sql = fs.readFileSync('migrations/' + f, 'utf-8');
                  for (const stmt of sql.split(';').map(s=>s.trim()).filter(Boolean)) {
                    try { await c.execute(stmt); } catch(e) {}
                  }
                }
              })();
            "
          fi
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        continue-on-error: true

      # ── 部署 Worker（workers/hybrid 模式） ─────────────────────────────
      - name: Deploy Worker
        if: ${{ vars.DEPLOY_MODE != 'pages' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cat > .deploy-secrets.env <<EOF
          TURSO_URL=${{ secrets.TURSO_URL }}
          TURSO_TOKEN=${{ secrets.TURSO_TOKEN }}
          ADMIN_TOKEN=${{ secrets.ADMIN_TOKEN }}
          RATE_LIMIT_SALT=${{ secrets.RATE_LIMIT_SALT }}
          EOF

          [ -n "${{ secrets.JWT_SECRET }}" ] && echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .deploy-secrets.env
          [ -n "${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}" ] && echo "CREDENTIALS_ENCRYPTION_KEY=${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}" >> .deploy-secrets.env
          [ -n "${{ secrets.TURNSTILE_SECRET_KEY }}" ] && echo "TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}" >> .deploy-secrets.env
          [ -n "${{ secrets.RESEND_API_KEY }}" ] && echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .deploy-secrets.env

          npx wrangler deploy --secrets-file=.deploy-secrets.env

          : > .deploy-secrets.env && rm -f .deploy-secrets.env

      # ── 部署 Pages（pages/hybrid 模式） ────────────────────────────────
      - name: Deploy Pages
        if: ${{ vars.DEPLOY_MODE == 'pages' || vars.DEPLOY_MODE == 'hybrid' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          PAGES_DIR="${PAGES_DIR:-public}"
          PAGES_PROJECT="${{ vars.PAGES_PROJECT_NAME || vars.WORKER_NAME || '{{WORKER_NAME}}' }}"
          npx wrangler pages deploy "$PAGES_DIR" \
            --project-name="$PAGES_PROJECT" \
            --branch=main \
            --commit-msg="CI deploy ${{ github.sha }}"

      # ── 绑定自定义域名（可选） ──────────────────────────────────────────
      - name: Bind custom domain
        if: ${{ vars.BIND_DOMAIN == 'true' && vars.APP_DOMAIN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACCOUNT_ID=$(curl -sS "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id')

          DOMAIN="${{ vars.APP_DOMAIN }}"
          ZONE_NAME=$(echo "$DOMAIN" | awk -F. '{print $(NF-1)"."$NF}')
          ZONE_ID=$(curl -sS "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id')

          if [ "${{ vars.DEPLOY_MODE }}" = "pages" ]; then
            echo "Pages 模式：域名通过 Pages 项目自动绑定"
          else
            curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/domains" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"service\":\"{{WORKER_NAME}}\",\"hostname\":\"${DOMAIN}\",\"zone_id\":\"${ZONE_ID}\",\"environment\":\"production\"}" \
              | jq .success
          fi
        continue-on-error: true

      # ── 冒烟测试 ──────────────────────────────────────────────────────
      - name: Smoke test
        env:
          BASE_URL: ${{ vars.BIND_DOMAIN == 'true' && format('https://{0}', vars.APP_DOMAIN) || (vars.DEPLOY_MODE == 'pages' && format('https://{0}.pages.dev', vars.WORKER_NAME || '{{WORKER_NAME}}') || format('https://{0}.workers.dev', vars.WORKER_NAME || '{{WORKER_NAME}}')) }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DEPLOY_MODE: ${{ vars.DEPLOY_MODE || 'workers' }}
        run: |
          echo "Testing: $BASE_URL (mode: $DEPLOY_MODE)"
          sleep 5

          if [ "$DEPLOY_MODE" = "pages" ]; then
            curl -sS "$BASE_URL/" -o /dev/null -w "Homepage: HTTP %{http_code}\n"
          else
            curl -sS "$BASE_URL/api/health" | jq .
            if [ -f "scripts/smoke-readonly.mjs" ]; then
              node scripts/smoke-readonly.mjs
            fi
            if [ -f "scripts/smoke-admin.mjs" ]; then
              node scripts/smoke-admin.mjs
            fi
          fi
        continue-on-error: true

      # ── 部署报告 ──────────────────────────────────────────────────────
      - name: Deploy summary
        if: always()
        run: |
          echo "## 🚀 {{PROJECT_NAME}} 部署报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 分支 | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 提交 | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 时间 | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| 模式 | ${{ vars.DEPLOY_MODE || 'workers' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Worker | {{WORKER_NAME}} |" >> $GITHUB_STEP_SUMMARY
