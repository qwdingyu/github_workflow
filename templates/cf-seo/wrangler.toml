# Cloudflare Pages 配置文件
# 文档: https://developers.cloudflare.com/pages/configuration/

# 项目名称
name = "cf-seo"

# Pages 配置
[site]
bucket = "./_site"

# 构建配置
[build]
command = "pnpm run build"
output_dir = "_site"

# 环境变量（可选）
# [vars]
# SITE_URL = "https://example.com"

# 兼容性日期
compatibility_date = "2024-01-01"
