<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — SEO Guardian</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
      --text: #e4e4e7; --text2: #9ca3af;
      --accent: #6366f1; --accent-hover: #818cf8;
      --success: #22c55e; --error: #ef4444; --warning: #f59e0b;
      --radius: 12px; --max-w: 1200px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    a { color: var(--accent); text-decoration: none; }

    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; max-width: var(--max-w); margin: 0 auto; }
    .logo { font-size: 1.3rem; font-weight: 800; }
    .logo span { color: var(--accent); }
    .nav-right { display: flex; gap: 16px; align-items: center; font-size: 0.9rem; color: var(--text2); }

    .container { max-width: var(--max-w); margin: 0 auto; padding: 24px; }

    /* Overview Stats */
    .overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .stat-card .label { font-size: 0.8rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 2rem; font-weight: 800; margin-top: 4px; }
    .stat-card .value.up { color: var(--success); }
    .stat-card .value.down { color: var(--error); }
    .stat-card .value.warn { color: var(--warning); }

    /* Sites Section */
    .sites-section h2 { font-size: 1.3rem; margin-bottom: 16px; }
    .site-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
    .site-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .site-info h3 { font-size: 1.05rem; margin-bottom: 4px; }
    .site-info .url { color: var(--text2); font-size: 0.85rem; }
    .site-actions { display: flex; gap: 8px; }
    .site-actions a { padding: 6px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; border: 1px solid var(--border); color: var(--text2); }
    .site-actions a:hover { border-color: var(--accent); color: var(--accent); }

    /* Score Grid */
    .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .score-panel { background: var(--bg); border-radius: 8px; padding: 16px; text-align: center; }
    .score-panel .score-label { font-size: 0.75rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .score-panel .score-value { font-size: 2.2rem; font-weight: 800; }
    .score-panel .trend { font-size: 0.85rem; margin-top: 4px; }
    .trend.up { color: var(--success); }
    .trend.down { color: var(--error); }
    .trend.stable { color: var(--text2); }

    /* Score bar */
    .score-bar-bg { height: 6px; background: var(--border); border-radius: 3px; margin-top: 8px; overflow: hidden; }
    .score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }

    .add-site { background: var(--surface); border: 2px dashed var(--border); border-radius: var(--radius); padding: 24px; text-align: center; cursor: pointer; margin-top: 16px; }
    .add-site:hover { border-color: var(--accent); }
    .add-site p { color: var(--text2); }

    .empty { text-align: center; padding: 60px 24px; color: var(--text2); }
    .empty h2 { margin-bottom: 12px; color: var(--text); }

    .btn-primary { background: var(--accent); color: #fff; padding: 10px 24px; border-radius: var(--radius); font-size: 0.95rem; font-weight: 600; border: none; cursor: pointer; display: inline-block; }
    .btn-primary:hover { background: var(--accent-hover); }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; width: 100%; max-width: 400px; }
    .modal h3 { margin-bottom: 16px; }
    .modal input { width: 100%; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.95rem; margin-bottom: 12px; }
    .modal input:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 8px; }
    .btn-ghost { background: transparent; color: var(--text2); padding: 10px 20px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }

    .login-prompt { text-align: center; padding: 80px 24px; }
    .login-prompt h1 { margin-bottom: 12px; }
    .login-prompt p { color: var(--text2); margin-bottom: 24px; }
    .login-prompt input { max-width: 300px; display: block; margin: 0 auto 16px; }

    .scan-time { font-size: 0.75rem; color: var(--text2); margin-top: 4px; }

    @media (max-width: 768px) {
      .site-header { flex-direction: column; text-align: center; gap: 12px; }
      .score-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><span>🛡️</span> SEO Guardian</div>
    <div class="nav-right">
      <span id="user-email"></span>
      <a href="/" style="font-size:0.85rem">Home</a>
      <a href="/audit.html" style="font-size:0.85rem">Full Audit</a>
      <a href="/optimize.html" style="font-size:0.85rem">Fix Code</a>
      <a href="/competitors.html" style="font-size:0.85rem">Competitors</a>
      <a href="/report.html" style="font-size:0.85rem">Reports</a>
      <a href="/weekly-report.html" style="font-size:0.85rem">Weekly</a>
      <a href="/geo-check.html" style="font-size:0.85rem">GEO Check</a>
      <a href="#" id="logout-btn" style="font-size:0.85rem;color:var(--error)">Logout</a>
    </div>
  </nav>

  <div class="container" id="app"></div>

  <script>
    let token = localStorage.getItem('cf_token');

    function showLogin() {
      window.location.href = '/login.html';
    }

    function scoreColor(score) {
      if (score >= 80) return 'var(--success)';
      if (score >= 50) return 'var(--warning)';
      return 'var(--error)';
    }

    function trendIcon(dir) {
      if (dir === 'up') return '↑';
      if (dir === 'down') return '↓';
      return '→';
    }

    async function loadDashboard() {
      const headers = { 'x-auth-token': token };
      try {
        const [userRes, dashRes] = await Promise.all([
          fetch('/api/auth/me', { headers }),
          fetch('/api/dashboard', { headers }),
        ]);
        if (!userRes.ok) { showLogin(); return; }
        const userData = await userRes.json();
        const dashData = await dashRes.json();
        document.getElementById('user-email').textContent = userData.user.email;

        const app = document.getElementById('app');
        if (!dashData.sites || dashData.sites.length === 0) {
          app.innerHTML = `
            <div class="empty">
              <h2>Welcome to SEO Guardian</h2>
              <p>Add your first website to start monitoring SEO & GEO health.</p>
              <br><div class="add-site" onclick="showAddSite()"><p>＋ Add Your Website</p></div>
            </div>`;
          return;
        }

        let html = `
          <div class="overview">
            <div class="stat-card">
              <div class="label">Sites Monitored</div>
              <div class="value">${dashData.overview.total_sites}</div>
            </div>
            <div class="stat-card">
              <div class="label">Avg SEO Score</div>
              <div class="value">${dashData.sites.filter(s => s.last_score != null).length ? Math.round(dashData.sites.reduce((a, s) => a + (s.last_score || 0), 0) / dashData.sites.filter(s => s.last_score != null).length) : '—'}</div>
            </div>
            <div class="stat-card">
              <div class="label">Avg GEO Score</div>
              <div class="value">${dashData.sites.filter(s => s.last_geo_score > 0).length ? Math.round(dashData.sites.reduce((a, s) => a + (s.last_geo_score || 0), 0) / dashData.sites.filter(s => s.last_geo_score > 0).length) : '—'}</div>
            </div>
            <div class="stat-card">
              <div class="label">Unresolved Alerts</div>
              <div class="value ${dashData.overview.unresolved_alerts > 0 ? 'warn' : ''}">${dashData.overview.unresolved_alerts}</div>
            </div>
          </div>
          <div class="sites-section"><h2>Your Websites</h2>`;

        for (const site of dashData.sites) {
          const seoScore = site.last_score ?? '—';
          const geoScore = site.last_geo_score || 0;
          const seoTrendIcon = trendIcon(site.seo_trend_direction);
          const geoTrendIcon = trendIcon(site.geo_trend_direction);

          html += `
            <div class="site-card">
              <div class="site-header">
                <div class="site-info">
                  <h3>${site.name || site.url}</h3>
                  <div class="url">${site.url}</div>
                  <div class="scan-time">Last scan: ${site.last_scan_at ? new Date(site.last_scan_at).toLocaleString() : 'Never'}</div>
                </div>
                <div class="site-actions">
                  <a href="/report.html?siteId=${site.id}">Report</a>
                  <a href="/optimize.html?siteId=${site.id}">Fix</a>
                </div>
              </div>
              <div class="score-grid">
                <div class="score-panel">
                  <div class="score-label">SEO Score</div>
                  <div class="score-value" style="color:${typeof seoScore === 'number' ? scoreColor(seoScore) : 'var(--text2)'}">${seoScore}</div>
                  ${site.seo_trend !== 0 ? `<div class="trend ${site.seo_trend_direction}">${seoTrendIcon} ${Math.abs(site.seo_trend)}</div>` : ''}
                  ${typeof seoScore === 'number' ? `<div class="score-bar-bg"><div class="score-bar-fill" style="width:${seoScore}%;background:${scoreColor(seoScore)}"></div></div>` : ''}
                </div>
                <div class="score-panel">
                  <div class="score-label">GEO Score (AI Search)</div>
                  <div class="score-value" style="color:${scoreColor(geoScore)}">${geoScore}</div>
                  ${site.geo_trend !== 0 ? `<div class="trend ${site.geo_trend_direction}">${geoTrendIcon} ${Math.abs(site.geo_trend)}</div>` : ''}
                  <div class="score-bar-bg"><div class="score-bar-fill" style="width:${Math.min(geoScore, 100)}%;background:${scoreColor(geoScore)}"></div></div>
                </div>
              </div>
            </div>`;
        }

        html += `</div><div class="add-site" onclick="showAddSite()"><p>＋ Add Another Website</p></div>`;
        app.innerHTML = html;
      } catch { showLogin(); }
    }

    function showAddSite() {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal">
          <h3>Add Website</h3>
          <label style="font-size:0.8rem;color:var(--text2);display:block;margin-bottom:6px">URL</label>
          <input type="url" id="site-url" placeholder="https://example.com">
          <label style="font-size:0.8rem;color:var(--text2);display:block;margin-bottom:6px">Name (optional)</label>
          <input type="text" id="site-name" placeholder="My Website">
          <div class="modal-actions">
            <button class="btn-ghost" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
            <button class="btn-primary" onclick="addSite()">Add Site</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
    }

    async function addSite() {
      const url = document.getElementById('site-url').value.trim();
      const name = document.getElementById('site-name').value.trim();
      if (!url) return;
      try {
        const res = await fetch('/api/sites', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
          body: JSON.stringify({ url, name }),
        });
        if (!res.ok) { const data = await res.json(); alert(data.error || 'Failed to add site'); return; }
        document.querySelector('.modal-overlay').remove();
        loadDashboard();
      } catch { alert('Network error'); }
    }

    document.getElementById('logout-btn').addEventListener('click', (e) => {
      e.preventDefault(); localStorage.removeItem('cf_token'); localStorage.removeItem('cf_user'); token = null; showLogin();
    });

    if (!token) showLogin(); else loadDashboard();
  </script>
</body>
</html>
