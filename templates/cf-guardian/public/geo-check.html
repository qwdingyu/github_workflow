<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEO 体检 — 30秒检查你的网站是否被 AI 搜索看见</title>
  <meta name="description" content="免费 GEO 体检工具：检查 llms.txt、Schema 结构化数据、OG 标签、AI 爬虫可访问性等 10 项 GEO 指标，一键生成优化报告。">
  <link rel="icon" href="/favicon.svg">
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
      --text: #e4e4e7; --text2: #9ca3af;
      --accent: #6366f1; --accent-hover: #818cf8;
      --success: #22c55e; --error: #ef4444; --warning: #f59e0b;
      --radius: 12px; --max-w: 800px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }

    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; max-width: var(--max-w); margin: 0 auto; }
    .logo { font-size: 1.3rem; font-weight: 800; color: var(--text); }
    .logo span { color: var(--accent); }
    .nav-links a { margin-left: 24px; color: var(--text2); font-size: 0.9rem; }

    .hero { text-align: center; padding: 60px 24px 40px; max-width: 700px; margin: 0 auto; }
    .hero h1 { font-size: 2.4rem; font-weight: 800; margin-bottom: 16px; background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero p { font-size: 1.1rem; color: var(--text2); margin-bottom: 32px; }

    .check-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; margin: 0 auto; max-width: 600px; }
    .input-row { display: flex; gap: 12px; }
    .input-row input { flex: 1; padding: 14px 18px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 1rem; outline: none; }
    .input-row input:focus { border-color: var(--accent); }
    .input-row button { padding: 14px 28px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-size: 1rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .input-row button:hover { background: var(--accent-hover); }
    .input-row button:disabled { opacity: 0.6; cursor: not-allowed; }
    .hint { color: var(--text2); font-size: 0.85rem; margin-top: 12px; }

    /* Loading */
    .loading { display: none; text-align: center; padding: 40px; }
    .loading.active { display: block; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Results */
    .results { display: none; max-width: 700px; margin: 0 auto; padding: 0 24px 60px; }
    .results.active { display: block; }

    .score-ring { text-align: center; margin: 32px 0; }
    .score-ring .ring { width: 160px; height: 160px; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .score-ring .ring .number { font-size: 3rem; font-weight: 800; }
    .score-ring .ring .label { font-size: 0.9rem; color: var(--text2); }

    .check-list { margin-top: 24px; }
    .check-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 12px; display: flex; align-items: flex-start; gap: 14px; }
    .check-item .status-icon { font-size: 1.4rem; flex-shrink: 0; margin-top: 2px; }
    .check-item .status-icon.pass { color: var(--success); }
    .check-item .status-icon.warn { color: var(--warning); }
    .check-item .status-icon.fail { color: var(--error); }
    .check-item .info { flex: 1; }
    .check-item .info h4 { font-size: 0.95rem; margin-bottom: 4px; }
    .check-item .info p { font-size: 0.85rem; color: var(--text2); }
    .check-item .score-badge { font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; flex-shrink: 0; }
    .check-item .score-badge.pass { background: rgba(34,197,94,0.15); color: var(--success); }
    .check-item .score-badge.warn { background: rgba(245,158,11,0.15); color: var(--warning); }
    .check-item .score-badge.fail { background: rgba(239,68,68,0.15); color: var(--error); }

    .cta-section { text-align: center; margin-top: 40px; padding: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .cta-section h3 { margin-bottom: 12px; }
    .cta-section p { color: var(--text2); margin-bottom: 20px; font-size: 0.95rem; }
    .btn-primary { background: var(--accent); color: #fff; padding: 14px 32px; border-radius: var(--radius); font-size: 1rem; font-weight: 600; border: none; cursor: pointer; display: inline-block; }
    .btn-primary:hover { background: var(--accent-hover); }

    .error-msg { display: none; text-align: center; padding: 24px; color: var(--error); background: rgba(239,68,68,0.1); border-radius: var(--radius); margin: 20px auto; max-width: 600px; }
    .error-msg.active { display: block; }

    footer { text-align: center; padding: 40px 24px; color: var(--text2); font-size: 0.85rem; border-top: 1px solid var(--border); margin-top: 40px; }

    @media (max-width: 600px) {
      .hero h1 { font-size: 1.8rem; }
      .input-row { flex-direction: column; }
      .navbar { flex-direction: column; gap: 12px; }
      .nav-links a { margin-left: 12px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><span>🔍</span> GEO 体检</div>
    <div class="nav-links">
      <a href="/">首页</a>
      <a href="/signup.html">注册</a>
    </div>
  </nav>

  <section class="hero">
    <h1>你的网站被 AI 搜索"看见"了吗？</h1>
    <p>30 秒免费体检，检查 llms.txt、Schema 结构化数据、OG 标签等 10 项 GEO 核心指标</p>

    <div class="check-box">
      <div class="input-row">
        <input type="url" id="urlInput" placeholder="https://yourstore.com" value="">
        <button id="checkBtn" onclick="runCheck()">开始检查</button>
      </div>
      <p class="hint">输入你的网站 URL，免费生成 GEO 体检报告</p>
    </div>
  </section>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>正在检查你的网站...</p>
    <p style="color: var(--text2); font-size: 0.85rem;">正在分析 Schema、llms.txt、OG 标签等指标</p>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="results" id="results">
    <div class="score-ring">
      <div class="ring" id="scoreRing">
        <div class="number" id="scoreNumber">--</div>
        <div class="label">GEO 健康评分</div>
      </div>
    </div>

    <div class="check-list" id="checkList"></div>

    <div class="cta-section">
      <h3>想要自动监控和优化？</h3>
      <p>升级专业版，每周自动检查 AI 搜索引擎收录变化，竞品 GEO 对比分析</p>
      <a href="/signup.html" class="btn-primary">开始 7 天免费试用 →</a>
    </div>
  </div>

  <footer>
    <p>© 2026 SEO Guardian. Built on Cloudflare.</p>
    <p style="margin-top:8px"><a href="/">首页</a> · <a href="/signup.html">注册</a></p>
  </footer>

  <script>
    async function runCheck() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) {
        showError('请输入网站 URL');
        return;
      }
      try { new URL(url); } catch {
        showError('请输入有效的 URL（如 https://example.com）');
        return;
      }

      // Reset
      document.getElementById('loading').classList.add('active');
      document.getElementById('results').classList.remove('active');
      document.getElementById('errorMsg').classList.remove('active');
      document.getElementById('checkBtn').disabled = true;

      try {
        const res = await fetch('/api/geo/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.error || '检查失败，请稍后重试');
          return;
        }

        renderResults(data);
      } catch (err) {
        showError('网络错误：' + err.message);
      } finally {
        document.getElementById('loading').classList.remove('active');
        document.getElementById('checkBtn').disabled = false;
      }
    }

    function showError(msg) {
      document.getElementById('loading').classList.remove('active');
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.add('active');
    }

    function renderResults(data) {
      const results = document.getElementById('results');
      const scoreNum = document.getElementById('scoreNumber');
      const scoreRing = document.getElementById('scoreRing');
      const checkList = document.getElementById('checkList');

      // Score
      const score = data.geo_score || 0;
      scoreNum.textContent = score;
      const hue = score >= 80 ? '140' : score >= 50 ? '40' : '0';
      scoreRing.style.border = `4px solid hsl(${hue}, 80%, 50%)`;
      scoreNum.style.color = `hsl(${hue}, 80%, 50%)`;

      // Checks
      checkList.innerHTML = '';
      for (const check of data.checks) {
        const icon = check.status === 'pass' ? '✅' : check.status === 'warn' ? '⚠️' : '❌';
        const detailText = buildDetailText(check);
        checkList.innerHTML += `
          <div class="check-item">
            <div class="status-icon ${check.status}">${icon}</div>
            <div class="info">
              <h4>${check.label || check.type}</h4>
              <p>${detailText}</p>
            </div>
            <div class="score-badge ${check.status}">${check.score}/100</div>
          </div>
        `;
      }

      results.classList.add('active');
      results.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function buildDetailText(check) {
      const d = check.details || {};
      if (check.status === 'pass') {
        if (d.lines) return `已找到，共 ${d.lines} 行内容`;
        if (d.count) return `已找到 ${d.count} 个 ${check.type} 标记`;
        if (d.og_title) return `og:title="${d.og_title.slice(0, 50)}..."`;
        return '检查通过';
      }
      if (d.fix) return d.fix;
      if (d.message) return d.message;
      if (d.missing) return `缺少: ${d.missing.join(', ')}`;
      if (d.blocked_bots) return `被限制的 AI 爬虫: ${d.blocked_bots.join(', ')}`;
      if (d.blocked) return d.message || 'AI 爬虫被阻止';
      return '需要优化';
    }

    // Allow Enter key to trigger check
    document.getElementById('urlInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') runCheck();
    });
  </script>
</body>
</html>
