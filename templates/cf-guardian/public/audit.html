<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full-Site Audit — SEO Guardian</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; color: #f8fafc; }
    h2 { font-size: 1.3rem; margin-bottom: 12px; color: #f1f5f9; }
    .subtitle { color: #94a3b8; margin-bottom: 24px; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; margin-bottom: 20px; border: 1px solid #334155; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .metric-card { background: #0f172a; border-radius: 10px; padding: 20px; text-align: center; border: 1px solid #334155; }
    .metric-value { font-size: 2.2rem; font-weight: 700; margin-bottom: 4px; }
    .metric-label { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .score-a { color: #22c55e; } .score-b { color: #38bdf8; } .score-c { color: #fbbf24; } .score-d { color: #f97316; } .score-f { color: #ef4444; }
    .btn { padding: 10px 20px; border-radius: 8px; border: none; font-size: 0.95rem; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .btn-primary { background: #6366f1; color: white; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-secondary:hover { background: #475569; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    select, input { background: #0f172a; border: 1px solid #475569; color: #e2e8f0; padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; width: 100%; }
    select:focus, input:focus { outline: none; border-color: #6366f1; }
    .form-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .form-row > * { flex: 1; min-width: 150px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 0.9rem; }
    th { color: #94a3b8; font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
    tr:hover { background: #1e293b44; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; }
    .badge-pass { background: #22c55e22; color: #22c55e; }
    .badge-warn { background: #fbbf2422; color: #fbbf24; }
    .badge-fail { background: #ef444422; color: #ef4444; }
    .badge-critical { background: #ef444422; color: #ef4444; }
    .badge-warning { background: #fbbf2422; color: #fbbf24; }
    .badge-info { background: #38bdf822; color: #38bdf8; }
    .progress-bar { background: #334155; border-radius: 6px; height: 8px; overflow: hidden; margin-top: 6px; }
    .progress-fill { height: 100%; border-radius: 6px; transition: width 0.5s ease; }
    .loading { text-align: center; padding: 60px 20px; }
    .spinner { width: 40px; height: 40px; border: 3px solid #334155; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
    .page-url { color: #6366f1; word-break: break-all; }
    .tab-bar { display: flex; gap: 4px; margin-bottom: 20px; background: #0f172a; padding: 4px; border-radius: 10px; }
    .tab-btn { padding: 8px 16px; border: none; background: transparent; color: #94a3b8; cursor: pointer; border-radius: 8px; font-size: 0.9rem; font-weight: 500; }
    .tab-btn.active { background: #6366f1; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .issue-item { padding: 12px 16px; background: #0f172a; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid #334155; }
    .issue-item.critical { border-left-color: #ef4444; }
    .issue-item.warning { border-left-color: #fbbf24; }
    .issue-item.info { border-left-color: #38bdf8; }
    .issue-title { font-weight: 600; margin-bottom: 4px; }
    .issue-msg { color: #94a3b8; font-size: 0.9rem; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .header-actions { display: flex; gap: 8px; }
    #exportPdf { background: #059669; color: white; }
    #exportPdf:hover { background: #047857; }
    .security-header-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #33415522; }
    .security-header-name { font-weight: 500; font-family: monospace; font-size: 0.9rem; }
    .security-header-value { color: #94a3b8; font-size: 0.85rem; max-width: 500px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media print { body { background: white; color: #1e293b; } .card { border-color: #e2e8f0; background: #f8fafc; } .header-actions { display: none; } }
    @media (max-width: 768px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } .form-row { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔬 Full-Site Audit</h1>
    <p class="subtitle">Multi-page crawl with SEO, GEO, Content, Security & Sitemap analysis</p>

    <!-- Site Selector -->
    <div class="card" id="siteSelector">
      <h2>Select Site to Audit</h2>
      <div class="form-row">
        <select id="siteSelect"><option value="">Loading sites...</option></select>
        <div style="display:flex;gap:8px;align-items:flex-end;">
          <button class="btn btn-primary" id="runAuditBtn" onclick="runAudit()" style="flex:1;">Run Full Audit →</button>
        </div>
      </div>
      <div class="form-row">
        <div>
          <label style="font-size:0.85rem;color:#94a3b8;margin-bottom:4px;display:block;">Max Pages</label>
          <select id="maxPages">
            <option value="5">5 pages (Quick)</option>
            <option value="10" selected>10 pages (Standard)</option>
            <option value="20">20 pages (Deep)</option>
            <option value="50">50 pages (Full)</option>
          </select>
        </div>
        <div>
          <label style="font-size:0.85rem;color:#94a3b8;margin-bottom:4px;display:block;">Max Depth</label>
          <select id="maxDepth">
            <option value="1">1 level</option>
            <option value="2" selected>2 levels</option>
            <option value="3">3 levels</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Loading State -->
    <div class="card hidden" id="loadingState">
      <div class="loading">
        <div class="spinner"></div>
        <h2 id="loadingText">Crawling site pages...</h2>
        <p style="color:#94a3b8;margin-top:8px;" id="loadingSubtext">This may take 30-120 seconds depending on site size</p>
      </div>
    </div>

    <!-- Results -->
    <div class="hidden" id="resultsSection">
      <div class="header">
        <div>
          <h2 id="resultSiteName">Audit Results</h2>
          <p style="color:#94a3b8;font-size:0.9rem;" id="resultSiteUrl"></p>
        </div>
        <div class="header-actions">
          <button class="btn btn-secondary" onclick="runAudit()">Re-run Audit</button>
          <button class="btn" id="exportPdf" onclick="window.print()">📄 Print / PDF</button>
        </div>
      </div>

      <!-- Score Cards -->
      <div class="grid-4" id="scoreCards"></div>

      <!-- Tabs -->
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('pages')">📄 Pages</button>
        <button class="tab-btn" onclick="switchTab('issues')">⚠️ Issues</button>
        <button class="tab-btn" onclick="switchTab('performance')">⚡ Performance</button>
        <button class="tab-btn" onclick="switchTab('robots')">🤖 Robots.txt</button>
        <button class="tab-btn" onclick="switchTab('sitemap')">🗺️ Sitemap</button>
        <button class="tab-btn" onclick="switchTab('security')">🔒 Security</button>
        <button class="tab-btn" onclick="switchTab('geo')">🧠 GEO</button>
      </div>

      <!-- Pages Tab -->
      <div class="tab-content active" id="tab-pages">
        <div class="card">
          <table>
            <thead>
              <tr><th>URL</th><th>Score</th><th>Words</th><th>Readability</th><th>Images</th><th>Load</th></tr>
            </thead>
            <tbody id="pagesTable"></tbody>
          </table>
        </div>
      </div>

      <!-- Issues Tab -->
      <div class="tab-content" id="tab-issues">
        <div class="card">
          <div id="issuesList"></div>
        </div>
      </div>

      <!-- Performance Tab -->
      <div class="tab-content" id="tab-performance">
        <div class="card" id="perfResults"></div>
      </div>

      <!-- Robots.txt Tab -->
      <div class="tab-content" id="tab-robots">
        <div class="card" id="robotsResults"></div>
      </div>

      <!-- Sitemap Tab -->
      <div class="tab-content" id="tab-sitemap">
        <div class="card" id="sitemapResults"></div>
      </div>

      <!-- Security Tab -->
      <div class="tab-content" id="tab-security">
        <div class="card" id="securityResults"></div>
      </div>

      <!-- GEO Tab -->
      <div class="tab-content" id="tab-geo">
        <div class="card" id="geoResults"></div>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    let token = localStorage.getItem('cf_token');
    let sites = [];

    async function loadSites() {
      if (!token) { window.location.href = '/login.html'; return; }
      try {
        const res = await fetch(`${API}/api/auth/me`, { headers: { 'x-auth-token': token } });
        if (!res.ok) { localStorage.removeItem('cf_token'); window.location.href = '/login.html'; return; }
        const data = await res.json();
        if (data.user && data.user.plan === 'free' && data.user.trial_ends_at) {
          if (new Date(data.user.trial_ends_at) < new Date()) {
            // Trial expired
          }
        }
      } catch {}

      try {
        const res = await fetch(`${API}/api/sites`, { headers: { 'x-auth-token': token } });
        if (res.ok) {
          const data = await res.json();
          sites = data.sites || [];
          const select = document.getElementById('siteSelect');
          select.innerHTML = sites.length === 0 ? '<option value="">No sites yet — add a site first</option>' :
            sites.map(s => `<option value="${s.id}">${s.name || s.url}</option>`).join('');
        }
      } catch {}
    }

    async function runAudit() {
      const siteId = document.getElementById('siteSelect').value;
      if (!siteId) { alert('Please select a site'); return; }

      document.getElementById('siteSelector').classList.add('hidden');
      document.getElementById('resultsSection').classList.add('hidden');
      document.getElementById('loadingState').classList.remove('hidden');

      const loadingMessages = [
        'Crawling site pages...',
        'Analyzing content quality...',
        'Validating sitemap...',
        'Checking security headers...',
        'Running GEO audit...',
        'Compiling results...'
      ];
      let msgIdx = 0;
      const msgInterval = setInterval(() => {
        msgIdx = Math.min(msgIdx + 1, loadingMessages.length - 1);
        document.getElementById('loadingText').textContent = loadingMessages[msgIdx];
      }, 15000);

      try {
        const res = await fetch(`${API}/api/audit/${siteId}/run`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
          body: JSON.stringify({
            maxPages: parseInt(document.getElementById('maxPages').value),
            maxDepth: parseInt(document.getElementById('maxDepth').value),
          })
        });

        clearInterval(msgInterval);

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Audit failed');
        }

        const data = await res.json();
        renderResults(data);
      } catch (err) {
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('siteSelector').classList.remove('hidden');
        alert('Audit failed: ' + err.message);
      }
    }

    function renderResults(data) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('resultsSection').classList.remove('hidden');

      const s = data.summary;
      const site = sites.find(s => s.id === document.getElementById('siteSelect').value);

      document.getElementById('resultSiteName').textContent = `Audit: ${site?.name || site?.url || 'Site'}`;
      document.getElementById('resultSiteUrl').textContent = site?.url || '';

      // Score cards
      const scores = [
        { label: 'SEO Score', value: s.overallScore, type: 'score' },
        { label: 'GEO Score', value: s.geoScore, type: 'score' },
        { label: 'Security', value: s.securityGrade, sub: s.securityScore + '/100', type: 'grade' },
        { label: 'Pages Crawled', value: s.pagesCrawled, sub: `${s.pagesDiscovered} discovered`, type: 'number' },
        { label: 'Sitemap', value: s.sitemapFound ? `${s.sitemapUrls} URLs` : 'Not found', type: 'text' },
        { label: 'Total Issues', value: s.totalIssues, sub: `${s.criticalIssues} critical`, type: 'number' },
      ];
      document.getElementById('scoreCards').innerHTML = scores.map(s => `
        <div class="metric-card">
          <div class="metric-value ${s.type === 'score' ? getScoreClass(s.value) : ''}">${s.value}</div>
          ${s.sub ? `<div style="color:#6366f1;font-size:0.85rem;margin-bottom:4px;">${s.sub}</div>` : ''}
          <div class="metric-label">${s.label}</div>
        </div>
      `).join('');

      // Pages table
      document.getElementById('pagesTable').innerHTML = data.pages.map(p => `
        <tr>
          <td><a href="${p.url}" target="_blank" class="page-url">${p.url}</a></td>
          <td><strong class="${getScoreClass(p.score)}">${p.score}</strong></td>
          <td>${p.content.wordCount.toLocaleString()}</td>
          <td><span class="${getScoreClass(p.content.readabilityScore)}">${p.content.readabilityScore}</span> (${p.content.readabilityGrade})</td>
          <td>${p.content.hasImages ? '✅' : '❌'} ${p.content.hasVideos ? '🎬' : ''}</td>
          <td>${p.loadTimeMs}ms</td>
        </tr>
      `).join('');

      // Issues
      const issues = data.issues || [];
      if (issues.length === 0) {
        document.getElementById('issuesList').innerHTML = '<p style="text-align:center;color:#22c55e;padding:20px;">🎉 No issues found! Your site is in great shape.</p>';
      } else {
        document.getElementById('issuesList').innerHTML = issues.map(i => `
          <div class="issue-item ${i.severity}">
            <div class="issue-title">
              <span class="badge badge-${i.severity}">${i.severity}</span>
              ${i.title}
            </div>
            <div class="issue-msg">${i.message}</div>
          </div>
        `).join('');
      }

      // Performance
      const perf = data.performance || {};
      document.getElementById('perfResults').innerHTML = `
        <h2>Page Performance Audit</h2>
        <div class="grid-4" style="margin-bottom:20px;">
          <div class="metric-card">
            <div class="metric-value ${getGradeClass(perf.grade || 'F')}" style="font-size:3rem;">${perf.grade || 'N/A'}</div>
            <div class="metric-label">Performance Grade</div>
          </div>
          <div class="metric-card">
            <div class="metric-value ${getScoreClass(perf.score || 0)}">${perf.score || 0}/100</div>
            <div class="metric-label">Score</div>
          </div>
          <div class="metric-card">
            <div class="metric-value">${perf.isMobileFriendly ? '✅' : '❌'}</div>
            <div class="metric-label">Mobile Friendly</div>
          </div>
          <div class="metric-card">
            <div class="metric-value">${(perf.pageSize || 0 > 1000 ? (perf.pageSize / 1024).toFixed(1) + 'KB' : perf.pageSize || 0)}</div>
            <div class="metric-label">Page Size</div>
          </div>
        </div>
        ${perf.lcp ? `
          <h3>Core Web Vitals (Estimated)</h3>
          <div class="grid-4">
            <div class="metric-card">
              <div class="metric-value ${getScoreClass(perf.lcp.score)}">${perf.lcp.value}</div>
              <div class="metric-label">LCP (Largest Contentful Paint)</div>
              <span class="badge badge-${perf.lcp.status === 'good' ? 'pass' : perf.lcp.status === 'needs-improvement' ? 'warn' : 'fail'}">${perf.lcp.status}</span>
            </div>
            <div class="metric-card">
              <div class="metric-value ${getScoreClass(perf.cls.score)}">${perf.cls.value}</div>
              <div class="metric-label">CLS (Cumulative Layout Shift)</div>
              <span class="badge badge-${perf.cls.status === 'good' ? 'pass' : perf.cls.status === 'needs-improvement' ? 'warn' : 'fail'}">${perf.cls.status}</span>
            </div>
            <div class="metric-card">
              <div class="metric-value ${getScoreClass(perf.inp.score)}">${perf.inp.value}</div>
              <div class="metric-label">INP (Interaction to Next Paint)</div>
              <span class="badge badge-${perf.inp.status === 'good' ? 'pass' : perf.inp.status === 'needs-improvement' ? 'warn' : 'fail'}">${perf.inp.status}</span>
            </div>
          </div>
        ` : ''}
        ${perf.resources ? `
          <h3 style="margin-top:16px;">Resource Analysis</h3>
          <table>
            <thead><tr><th>Type</th><th>Count</th><th>Issues</th></tr></thead>
            <tbody>
              <tr><td>Images</td><td>${perf.resources.images.count}</td><td>${perf.resources.images.missingAlt > 0 ? perf.resources.images.missingAlt + ' missing alt' : 'OK'} ${perf.resources.images.lazy < perf.resources.images.count ? perf.resources.images.lazy + '/' + perf.resources.images.count + ' lazy' : ''}</td></tr>
              <tr><td>Scripts</td><td>${perf.resources.scripts.count}</td><td>${perf.resources.scripts.blocking > 0 ? perf.resources.scripts.blocking + ' blocking' : 'OK'}</td></tr>
              <tr><td>Stylesheets</td><td>${perf.resources.stylesheets.count}</td><td>${perf.resources.stylesheets.renderBlocking > 0 ? perf.resources.stylesheets.renderBlocking + ' render-blocking' : 'OK'}</td></tr>
              <tr><td>Iframes</td><td>${perf.resources.iframes.count}</td><td>${perf.resources.iframes.count > 3 ? 'Many' : 'OK'}</td></tr>
            </tbody>
          </table>
        ` : ''}
        ${perf.issues && perf.issues.length > 0 ? `
          <h3 style="margin-top:16px;">Performance Issues</h3>
          ${perf.issues.map((i: any) => `
            <div class="issue-item ${i.severity}">
              <div class="issue-title"><span class="badge badge-${i.severity}">${i.severity}</span> ${i.title}</div>
              <div class="issue-msg">${i.message}</div>
            </div>
          `).join('')}
        ` : ''}
      `;

      // Robots.txt
      const robots = data.robots || {};
      document.getElementById('robotsResults').innerHTML = `
        <h2>Robots.txt Analysis</h2>
        <div class="grid-4" style="margin-bottom:20px;">
          <div class="metric-card">
            <div class="metric-value">${robots.found ? '✅' : '❌'}</div>
            <div class="metric-label">Found</div>
          </div>
          <div class="metric-card">
            <div class="metric-value ${getScoreClass(robots.score || 0)}">${robots.score || 0}/100</div>
            <div class="metric-label">Score</div>
          </div>
          <div class="metric-card">
            <div class="metric-value">${(robots.agents || []).length}</div>
            <div class="metric-label">User Agents</div>
          </div>
          <div class="metric-card">
            <div class="metric-value">${(robots.disallowedPaths || []).length}</div>
            <div class="metric-label">Disallow Groups</div>
          </div>
        </div>
        ${robots.agents && robots.agents.length > 0 ? `
          <h3>User Agents</h3>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;">
            ${robots.agents.map((a: string) => `<span class="badge badge-info">${a}</span>`).join('')}
          </div>
        ` : ''}
        ${robots.disallowedPaths && robots.disallowedPaths.length > 0 ? `
          <h3>Disallow Rules</h3>
          <table>
            <thead><tr><th>Agent</th><th>Blocked Paths</th></tr></thead>
            <tbody>
              ${robots.disallowedPaths.map((d: any) => `
                <tr><td><code>${d.agent}</code></td><td>${d.paths.map((p: string) => `<code>${p || '(entire site)'}</code>`).join(', ')}</td></tr>
              `).join('')}
            </tbody>
          </table>
        ` : ''}
        ${robots.issues && robots.issues.length > 0 ? `
          <h3 style="margin-top:16px;">Robots.txt Issues</h3>
          ${robots.issues.map((i: any) => `
            <div class="issue-item ${i.severity}">
              <div class="issue-title"><span class="badge badge-${i.severity}">${i.severity}</span> ${i.title}</div>
              <div class="issue-msg">${i.message}</div>
              ${i.fix ? `<div style="margin-top:8px;padding:8px;background:#0f172a;border-radius:6px;font-size:0.85rem;color:#94a3b8;"><strong style="color:#6366f1;">Fix:</strong> ${i.fix}</div>` : ''}
            </div>
          `).join('')}
        ` : (robots.found ? '<p style="color:#22c55e;text-align:center;padding:20px;">🎉 Robots.txt looks good!</p>' : '')}
      `;

      // Sitemap
      const sm = data.sitemap;
      document.getElementById('sitemapResults').innerHTML = `
        <h2>Sitemap Analysis</h2>
        <p style="margin-bottom:16px;">
          <span class="badge ${sm.found ? 'badge-pass' : 'badge-fail'}">${sm.found ? 'Found' : 'Not Found'}</span>
          ${sm.url ? `<a href="${sm.url}" target="_blank" style="color:#6366f1;margin-left:8px;">${sm.url}</a>` : ''}
        </p>
        ${sm.found ? `
          <div class="grid-4">
            <div class="metric-card"><div class="metric-value">${sm.totalUrls}</div><div class="metric-label">Total URLs</div></div>
            <div class="metric-card"><div class="metric-value score-c">${sm.errors.length}</div><div class="metric-label">Errors</div></div>
            <div class="metric-card"><div class="metric-value score-b">${sm.warnings.length}</div><div class="metric-label">Warnings</div></div>
          </div>
          ${sm.errors.length > 0 ? '<h3 style="margin-top:16px;color:#f97316;">Errors</h3>' + sm.errors.map(e => `<div class="issue-item critical"><div class="issue-title">${e.type}</div><div class="issue-msg">${e.message}${e.url ? ': ' + e.url : ''}</div></div>`).join('') : ''}
          ${sm.warnings.length > 0 ? '<h3 style="margin-top:16px;color:#fbbf24;">Warnings</h3>' + sm.warnings.map(w => `<div class="issue-item warning"><div class="issue-title">${w.type}</div><div class="issue-msg">${w.message}${w.url ? ': ' + w.url : ''}</div></div>`).join('') : ''}
        ` : '<p style="color:#94a3b8;">No sitemap.xml found. Create one at /sitemap.xml for better crawlability.</p>'}
      `;

      // Security
      const sec = data.security;
      document.getElementById('securityResults').innerHTML = `
        <h2>Security Headers Audit</h2>
        <div class="grid-4" style="margin-bottom:20px;">
          <div class="metric-card">
            <div class="metric-value ${getGradeClass(sec.grade)}" style="font-size:3rem;">${sec.grade}</div>
            <div class="metric-label">Security Grade</div>
          </div>
          <div class="metric-card">
            <div class="metric-value ${getScoreClass(sec.score)}">${sec.score}/100</div>
            <div class="metric-label">Score</div>
          </div>
          <div class="metric-card">
            <div class="metric-value">${sec.isHttps ? '✅' : '❌'}</div>
            <div class="metric-label">HTTPS</div>
          </div>
        </div>
        <h3>Headers Detail</h3>
        ${sec.headers.map(h => `
          <div class="security-header-row">
            <div>
              <span class="security-header-name">${h.name}</span>
              <span class="badge badge-${h.status}" style="margin-left:8px;">${h.status}</span>
            </div>
            <div class="security-header-value" title="${h.value || 'Not set'}">${h.value || '<span style="color:#ef4444;">Missing</span>'}</div>
          </div>
        `).join('')}
        ${sec.issues.length > 0 ? '<h3 style="margin-top:16px;">Recommendations</h3>' + sec.issues.map(i => `
          <div class="issue-item ${i.severity}">
            <div class="issue-title"><span class="badge badge-${i.severity}">${i.severity}</span> ${i.title}</div>
            <div class="issue-msg">${i.message}</div>
            <div style="margin-top:6px;font-size:0.85rem;color:#6366f1;">Fix: ${i.fix}</div>
          </div>
        `).join('') : ''}
      `;

      // GEO
      const geo = data.geo;
      document.getElementById('geoResults').innerHTML = `
        <h2>GEO (Generative Engine Optimization) Audit</h2>
        <div class="grid-4" style="margin-bottom:20px;">
          <div class="metric-card">
            <div class="metric-value ${getScoreClass(geo.score)}">${geo.score}/100</div>
            <div class="metric-label">GEO Score</div>
          </div>
          <div class="metric-card">
            <div class="metric-value" style="font-size:1.5rem;">${geo.band}</div>
            <div class="metric-label">Band</div>
          </div>
        </div>
        ${Object.keys(geo.breakdown || {}).length > 0 ? `
          <h3>Score Breakdown</h3>
          ${Object.entries(geo.breakdown).map(([k, v]) => `
            <div style="margin-bottom:8px;">
              <div style="display:flex;justify-content:space-between;font-size:0.9rem;">
                <span>${k}</span><span class="${getScoreClass(v)}">${v}%</span>
              </div>
              <div class="progress-bar"><div class="progress-fill" style="width:${v}%;background:${getScoreColor(v)};"></div></div>
            </div>
          `).join('')}
        ` : ''}
        <h3 style="margin-top:16px;">Check Results</h3>
        ${geo.checks.map(c => `
          <div class="security-header-row">
            <span class="security-header-name">${c.type}</span>
            <span class="badge badge-${c.status}">${c.status} (${c.score}/100)</span>
          </div>
        `).join('')}
      `;
    }

    function getScoreClass(v) {
      if (typeof v === 'string') v = parseInt(v);
      if (v >= 80) return 'score-a';
      if (v >= 60) return 'score-b';
      if (v >= 40) return 'score-c';
      if (v >= 20) return 'score-d';
      return 'score-f';
    }
    function getScoreColor(v) {
      if (v >= 80) return '#22c55e';
      if (v >= 60) return '#38bdf8';
      if (v >= 40) return '#fbbf24';
      if (v >= 20) return '#f97316';
      return '#ef4444';
    }
    function getGradeClass(g) {
      if (['A+', 'A'].includes(g)) return 'score-a';
      if (g === 'B') return 'score-b';
      if (g === 'C') return 'score-c';
      return 'score-f';
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    loadSites();
  </script>
</body>
</html>
