<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO vs GEO 对比报告 — SEO Guardian</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
      --text: #e4e4e7; --text2: #9ca3af;
      --accent: #6366f1; --accent-hover: #818cf8;
      --success: #22c55e; --error: #ef4444; --warning: #f59e0b;
      --radius: 12px; --max-w: 1100px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }

    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; max-width: var(--max-w); margin: 0 auto; }
    .logo { font-size: 1.3rem; font-weight: 800; }
    .logo span { color: var(--accent); }
    .nav-links a { margin-left: 24px; color: var(--text2); font-size: 0.9rem; }

    .container { max-width: var(--max-w); margin: 0 auto; padding: 24px; }

    .page-header { text-align: center; padding: 32px 0 24px; }
    .page-header h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 4px; }
    .page-header .site-url { color: var(--text2); font-size: 1rem; }
    .page-header .scan-time { color: var(--text2); font-size: 0.85rem; margin-top: 4px; }

    /* Score comparison */
    .score-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 32px; }
    .score-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; text-align: center; }
    .score-card .label { font-size: 0.85rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    .score-card .big-score { font-size: 4rem; font-weight: 800; }
    .score-card .score-meta { font-size: 0.9rem; color: var(--text2); margin-top: 8px; }
    .score-card .score-bar-bg { height: 8px; background: var(--border); border-radius: 4px; margin-top: 16px; overflow: hidden; }
    .score-card .score-bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }

    /* Issues */
    .section-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
    .section-title .badge { font-size: 0.75rem; padding: 2px 10px; border-radius: 20px; font-weight: 600; }
    .badge-critical { background: rgba(239,68,68,0.15); color: var(--error); }
    .badge-warning { background: rgba(245,158,11,0.15); color: var(--warning); }
    .badge-info { background: rgba(99,102,241,0.15); color: var(--accent); }
    .badge-pass { background: rgba(34,197,94,0.15); color: var(--success); }
    .badge-fail { background: rgba(239,68,68,0.15); color: var(--error); }

    .issue-list { margin-bottom: 32px; }
    .issue-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 14px; }
    .issue-item .icon { font-size: 1.3rem; flex-shrink: 0; }
    .issue-item .info { flex: 1; }
    .issue-item .info h4 { font-size: 0.95rem; margin-bottom: 4px; }
    .issue-item .info p { font-size: 0.85rem; color: var(--text2); }
    .issue-item .severity { font-size: 0.75rem; padding: 3px 10px; border-radius: 20px; font-weight: 600; flex-shrink: 0; }

    /* GEO checks */
    .geo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 32px; }
    .geo-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .geo-item .geo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .geo-item .geo-header h4 { font-size: 0.9rem; }
    .geo-item .geo-score { font-size: 0.85rem; font-weight: 700; }
    .geo-item .geo-detail { font-size: 0.8rem; color: var(--text2); }

    /* Trend chart (simple CSS bar chart) */
    .trend-section { margin-bottom: 32px; }
    .trend-chart { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
    .trend-bars { display: flex; align-items: flex-end; gap: 4px; height: 150px; margin-top: 16px; }
    .trend-bar-group { flex: 1; display: flex; gap: 2px; align-items: flex-end; }
    .trend-bar { flex: 1; border-radius: 3px 3px 0 0; min-height: 2px; transition: height 0.5s ease; }
    .trend-bar.seo { background: var(--accent); }
    .trend-bar.geo { background: #a855f7; }
    .trend-legend { display: flex; gap: 20px; margin-top: 12px; font-size: 0.8rem; color: var(--text2); }
    .trend-legend span { display: flex; align-items: center; gap: 6px; }
    .trend-legend .dot { width: 10px; height: 10px; border-radius: 2px; }

    /* AI Recommendations */
    .ai-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; margin-bottom: 32px; }
    .ai-section h3 { margin-bottom: 16px; }
    .ai-rec-item { background: var(--bg); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .ai-rec-item .priority { font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; background: var(--accent); color: #fff; display: inline-block; margin-bottom: 8px; }
    .ai-rec-item h4 { font-size: 0.95rem; margin-bottom: 6px; }
    .ai-rec-item p { font-size: 0.85rem; color: var(--text2); margin-bottom: 8px; }
    .ai-rec-item code { display: block; background: var(--surface); padding: 12px; border-radius: 6px; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; margin-top: 8px; }
    .ai-rec-item .meta { font-size: 0.8rem; color: var(--text2); }
    .ai-rec-item .meta span { margin-right: 12px; }

    .loading { text-align: center; padding: 60px; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg { text-align: center; padding: 40px; color: var(--error); }

    .btn-primary { background: var(--accent); color: #fff; padding: 10px 24px; border-radius: var(--radius); font-size: 0.95rem; font-weight: 600; border: none; cursor: pointer; display: inline-block; }
    .btn-primary:hover { background: var(--accent-hover); }

    .actions-bar { display: flex; gap: 12px; justify-content: center; margin-bottom: 32px; }

    footer { text-align: center; padding: 40px 24px; color: var(--text2); font-size: 0.85rem; border-top: 1px solid var(--border); margin-top: 40px; }

    @media (max-width: 768px) {
      .score-compare { grid-template-columns: 1fr; }
      .navbar { flex-direction: column; gap: 12px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><span>📊</span> SEO vs GEO 报告</div>
    <div class="nav-links">
      <a href="/dashboard.html">Dashboard</a>
      <a href="/">首页</a>
    </div>
  </nav>

  <div class="container" id="app">
    <div class="loading">
      <div class="spinner"></div>
      <p>正在加载报告...</p>
    </div>
  </div>

  <footer>
    <p>© 2026 SEO Guardian. Built on Cloudflare. Powered by AI.</p>
  </footer>

  <script>
    const token = localStorage.getItem('cf_token');
    if (!token) {
      window.location.replace('/login.html');
      return;
    }

    function scoreColor(score) {
      if (score >= 80) return 'var(--success)';
      if (score >= 50) return 'var(--warning)';
      return 'var(--error)';
    }

    function getBand(score) {
      if (score >= 86) return '优秀';
      if (score >= 68) return '良好';
      if (score >= 36) return '基础';
      return '需改进';
    }

    async function loadReport() {
      const params = new URLSearchParams(window.location.search);
      const siteId = params.get('siteId');
      if (!siteId) {
        document.getElementById('app').innerHTML = '<div class="error-msg"><h2>缺少 siteId 参数</h2><p>请从 Dashboard 访问此页面。</p></div>';
        return;
      }

      const headers = { 'x-auth-token': token || '' };

      try {
        const [compareRes, trendRes] = await Promise.all([
          fetch('/api/report/' + encodeURIComponent(siteId) + '/comparison', { headers }),
          fetch('/api/report/' + encodeURIComponent(siteId) + '/trend?limit=30', { headers }),
        ]);

        if (!compareRes.ok) {
          const err = await compareRes.json();
          document.getElementById('app').innerHTML = `<div class="error-msg"><h2>${err.error || '加载失败'}</h2><a href="/dashboard.html" class="btn-primary">返回 Dashboard</a></div>`;
          return;
        }

        const compare = await compareRes.json();
        const trend = await trendRes.json();

        renderReport(compare, trend);
      } catch (e) {
        document.getElementById('app').innerHTML = `<div class="error-msg"><h2>网络错误</h2><p>${e.message}</p></div>`;
      }
    }

    function renderReport(data, trend) {
      const app = document.getElementById('app');

      const seoScore = data.seo.score || 0;
      const geoScore = data.geo.score || 0;

      let html = `
        <div class="page-header">
          <h1>${data.site.name || data.site.url}</h1>
          <div class="site-url">${data.site.url}</div>
          <div class="scan-time">扫描时间: ${new Date(data.scanned_at).toLocaleString()}</div>
        </div>

        <div class="actions-bar">
          <a href="/optimize.html?siteId=${data.site.id}" class="btn-primary">一键修复 →</a>
          <a href="/dashboard.html" class="btn-primary" style="background:transparent;color:var(--text);border:1px solid var(--border)">返回 Dashboard</a>
        </div>

        <div class="score-compare">
          <div class="score-card">
            <div class="label">SEO Score (传统搜索)</div>
            <div class="big-score" style="color:${scoreColor(seoScore)}">${seoScore}</div>
            <div class="score-meta">通过率 ${data.seo.pass_rate}% · ${data.seo.issues_count} 个问题</div>
            <div class="score-bar-bg"><div class="score-bar-fill" style="width:${seoScore}%;background:${scoreColor(seoScore)}"></div></div>
          </div>
          <div class="score-card">
            <div class="label">GEO Score (AI 搜索)</div>
            <div class="big-score" style="color:${scoreColor(geoScore)}">${geoScore}</div>
            <div class="score-meta">等级: ${getBand(geoScore)} · ${data.geo.passed}/${data.geo.total_checks} 通过</div>
            <div class="score-bar-bg"><div class="score-bar-fill" style="width:${Math.min(geoScore, 100)}%;background:${scoreColor(geoScore)}"></div></div>
          </div>
        </div>`;

      // Trend chart
      if (trend.history && trend.history.length >= 2) {
        html += `
          <div class="trend-section">
            <div class="section-title">📈 SEO vs GEO 分数趋势</div>
            <div class="trend-chart">
              <div class="trend-bars">
                ${trend.history.map(h => {
                  const seoH = (h.score || 0);
                  const geoH = (h.geo_score || 0);
                  return `<div class="trend-bar-group">
                    <div class="trend-bar seo" style="height:${seoH}%"></div>
                    <div class="trend-bar geo" style="height:${Math.min(geoH, 100)}%"></div>
                  </div>`;
                }).join('')}
              </div>
              <div class="trend-legend">
                <span><div class="dot" style="background:var(--accent)"></div> SEO</span>
                <span><div class="dot" style="background:#a855f7"></div> GEO</span>
                <span style="margin-left:auto">SEO 趋势: ${trend.stats.seo.trend >= 0 ? '↑' : '↓'} ${Math.abs(trend.stats.seo.trend)} · GEO 趋势: ${trend.stats.geo.trend >= 0 ? '↑' : '↓'} ${Math.abs(trend.stats.geo.trend)}</span>
              </div>
            </div>
          </div>`;
      }

      // SEO Issues
      const criticalIssues = (data.issues && data.issues.critical) || [];
      const warningIssues = (data.issues && data.issues.warnings) || [];
      const infoIssues = (data.issues && data.issues.info) || [];

      if (criticalIssues.length) {
        html += `<div class="section-title">SEO 问题 <span class="badge badge-critical">严重 ${criticalIssues.length}</span></div><div class="issue-list">`;
        criticalIssues.forEach(i => {
          html += `<div class="issue-item">
            <div class="icon">🔴</div>
            <div class="info"><h4>${i.title}</h4><p>${i.message}</p></div>
            <div class="severity badge-critical">Critical</div>
          </div>`;
        });
        html += '</div>';
      }

      if (warningIssues.length) {
        html += `<div class="section-title">SEO 警告 <span class="badge badge-warning">${warningIssues.length}</span></div><div class="issue-list">`;
        warningIssues.forEach(i => {
          html += `<div class="issue-item">
            <div class="icon">🟡</div>
            <div class="info"><h4>${i.title}</h4><p>${i.message}</p></div>
            <div class="severity badge-warning">Warning</div>
          </div>`;
        });
        html += '</div>';
      }

      if (infoIssues.length) {
        html += `<div class="section-title">SEO 建议 <span class="badge badge-info">${infoIssues.length}</span></div><div class="issue-list">`;
        infoIssues.forEach(i => {
          html += `<div class="issue-item">
            <div class="icon">🔵</div>
            <div class="info"><h4>${i.title}</h4><p>${i.message}</p></div>
            <div class="severity badge-info">Info</div>
          </div>`;
        });
        html += '</div>';
      }

      // GEO Checks
      html += `<div class="section-title">GEO 检查项 (AI 搜索优化)</div><div class="geo-grid">`;
      const geoLabels = {
        robots_ai_access: 'AI 爬虫可访问性',
        llms_txt: 'llms.txt 文件',
        schema_completeness: 'Schema 完整性',
        schema_product: 'Product Schema',
        schema_offer: 'Offer Schema',
        schema_review: 'Review Schema',
        schema_faq: 'FAQ Schema',
        schema_breadcrumb: '面包屑 Schema',
        schema_organization: 'Organization Schema',
        og_tags: 'OG/Twitter 标签',
        content_depth: '内容深度',
        content_structure: '内容结构',
        content_front_loading: '首屏内容',
        heading_hierarchy: '标题层级',
        citation_links: '外部引用',
        eeats_signals: 'E-E-A-T 信任信号',
      };

      (data.geo_details || []).forEach(g => {
        const icon = g.status === 'pass' ? '✅' : g.status === 'warn' ? '⚠️' : '❌';
        const label = geoLabels[g.check_type] || g.check_type;
        html += `<div class="geo-item">
          <div class="geo-header">
            <h4>${icon} ${label}</h4>
            <div class="geo-score" style="color:${g.score >= 70 ? 'var(--success)' : g.score >= 40 ? 'var(--warning)' : 'var(--error)'}">${g.score}</div>
          </div>
          <div class="geo-detail">${g.status === 'pass' ? '检查通过' : g.status === 'warn' ? '需要优化' : '存在问题'}</div>
        </div>`;
      });
      html += '</div>';

      // AI Recommendations button
      html += `
        <div class="ai-section">
          <h3>🤖 AI 修复建议</h3>
          <p style="color:var(--text2);margin-bottom:16px">AI 会根据你的 SEO 和 GEO 问题，生成优先级排序的修复建议，附带可直接复制的代码。</p>
          <button class="btn-primary" onclick="loadAIRecommendations('${data.site.id}')">生成 AI 建议 →</button>
          <div id="ai-recs" style="margin-top:20px"></div>
        </div>`;

      app.innerHTML = html;
    }

    async function loadAIRecommendations(siteId) {
      const container = document.getElementById('ai-recs');
      container.innerHTML = '<div class="loading"><div class="spinner"></div><p>AI 正在分析你的网站...</p></div>';

      try {
        const res = await fetch('/api/report/' + encodeURIComponent(siteId) + '/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
        });
        const data = await res.json();

        if (!res.ok) {
          container.innerHTML = `<p style="color:var(--error)">${data.error || '生成失败'}</p>`;
          return;
        }

        if (data.message) {
          container.innerHTML = `<p style="color:var(--success)">${data.message}</p>`;
          return;
        }

        const recs = data.recommendations;
        if (recs.summary) {
          container.innerHTML += `<p style="margin-bottom:16px">${recs.summary}</p>`;
        }

        if (recs.recommendations) {
          recs.recommendations.forEach(r => {
            container.innerHTML += `
              <div class="ai-rec-item">
                <div class="priority">优先级 #${r.priority || '-'}</div>
                <h4>${r.title || r.action || ''}</h4>
                <p>${r.action || ''}</p>
                <div class="meta">
                  <span>影响: ${r.impact || '-'}</span>
                  <span>难度: ${r.effort || '-'}</span>
                  <span>类别: ${r.category === 'geo' ? 'GEO' : 'SEO'}</span>
                </div>
                ${r.code_snippet ? `<code>${r.code_snippet}</code>` : ''}
              </div>`;
          });
        }
      } catch (e) {
        container.innerHTML = `<p style="color:var(--error)">网络错误: ${e.message}</p>`;
      }
    }

    loadReport();
  </script>
</body>
</html>
