<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan History — SEO Guardian</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    .nav {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 0 24px;
      display: flex;
      align-items: center;
      height: 56px;
    }
    .nav-brand {
      font-weight: 800;
      font-size: 1.1rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-right: 32px;
    }
    .nav-links { display: flex; gap: 4px; }
    .nav-links a {
      color: #94a3b8;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .nav-links a:hover { color: #e2e8f0; background: #334155; }
    .nav-links a.active { color: #e2e8f0; background: #334155; }
    .nav-user { margin-left: auto; color: #94a3b8; font-size: 0.85rem; }
    .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
    h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 4px; }
    .subtitle { color: #94a3b8; margin-bottom: 24px; font-size: 0.9rem; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }
    tr:hover { background: rgba(99, 102, 241, 0.05); }
    .score-good { color: #22c55e; font-weight: 700; }
    .score-warn { color: #f59e0b; font-weight: 700; }
    .score-bad { color: #ef4444; font-weight: 700; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-completed { background: #14532d; color: #86efac; }
    .badge-running { background: #1e3a5f; color: #93c5fd; }
    .badge-failed { background: #7f1d1d; color: #fca5a5; }
    .badge-pending { background: #44403c; color: #fcd34d; }
    select {
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    select:focus { outline: none; border-color: #6366f1; }
    .trend-up { color: #22c55e; }
    .trend-down { color: #ef4444; }
    .trend-same { color: #94a3b8; }
    .btn {
      padding: 8px 16px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #4f46e5; }
    .loading { text-align: center; padding: 60px; color: #94a3b8; }
    .empty { text-align: center; padding: 60px; color: #94a3b8; }
    .empty h3 { color: #e2e8f0; margin-bottom: 8px; }
    .chart-container {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      height: 300px;
      position: relative;
    }
    .chart-canvas { width: 100%; height: 100%; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-brand">SEO Guardian</div>
    <div class="nav-links">
      <a href="/dashboard.html">Dashboard</a>
      <a href="/audit.html">Audit</a>
      <a href="/geo-check.html">GEO Check</a>
      <a href="/optimize.html">Optimizer</a>
      <a href="/report.html">SEO vs GEO</a>
      <a href="/weekly-report.html">Weekly Report</a>
      <a href="/scan-history.html" class="active">Scan History</a>
      <a href="/competitors.html">Competitors</a>
    </div>
    <div class="nav-user" id="userEmail"></div>
  </nav>

  <div class="container">
    <h1>Scan History</h1>
    <p class="subtitle">View all past scans and track your improvement over time</p>

    <select id="siteSelect">
      <option value="">Loading sites...</option>
    </select>

    <div id="content">
      <div class="empty">
        <h3>Select a site to view scan history</h3>
        <p>Your scan history will appear here once you run audits.</p>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    const token = localStorage.getItem('cf_token');
    if (!token) { window.location.href = '/login.html'; throw new Error('No token'); }

    document.getElementById('userEmail').textContent = JSON.parse(localStorage.getItem('cf_user') || '{}').email || '';

    async function loadSites() {
      const res = await fetch(`${API}/api/sites`, { headers: { 'x-auth-token': token } });
      if (res.ok) {
        const data = await res.json();
        const select = document.getElementById('siteSelect');
        select.innerHTML = data.sites.length === 0
          ? '<option value="">No sites — add one first</option>'
          : data.sites.map(s => `<option value="${s.id}">${s.name || s.url}</option>`).join('');
        if (data.sites.length > 0) loadHistory(data.sites[0].id);
      }
    }

    async function loadHistory(siteId) {
      if (!siteId) return;
      document.getElementById('content').innerHTML = '<div class="loading"><p>Loading scan history...</p></div>';

      try {
        const res = await fetch(`${API}/api/scans/${siteId}?limit=50`, {
          headers: { 'x-auth-token': token },
        });
        const data = await res.json();

        if (!res.ok || !data.scans || data.scans.length === 0) {
          document.getElementById('content').innerHTML = `
            <div class="empty">
              <h3>No scans yet</h3>
              <p>Run your first audit from the <a href="/audit.html" style="color:#818cf8;">Audit page</a>.</p>
            </div>`;
          return;
        }

        const scans = data.scans;
        const completedScans = scans.filter(s => s.status === 'completed');

        // Simple trend chart using CSS bars
        let chartHTML = '';
        if (completedScans.length >= 2) {
          const maxScore = Math.max(...completedScans.map(s => s.score || 0), 100);
          chartHTML = `
            <div class="card">
              <h2 style="margin-bottom:16px;">SEO Score Trend</h2>
              <div style="display:flex;align-items:flex-end;gap:4px;height:150px;padding:0 8px;">
                ${completedScans.map(s => {
                  const h = Math.max((s.score || 0) / maxScore * 100, 4);
                  const color = (s.score || 0) >= 80 ? '#22c55e' : (s.score || 0) >= 50 ? '#f59e0b' : '#ef4444';
                  const date = new Date(s.scanned_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                  return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">
                    <span style="font-size:0.7rem;font-weight:700;color:${color};margin-bottom:2px;">${s.score}</span>
                    <div style="width:100%;max-width:40px;height:${h}%;background:${color};border-radius:4px 4px 0 0;opacity:0.8;"></div>
                    <span style="font-size:0.6rem;color:#94a3b8;margin-top:4px;white-space:nowrap;">${date}</span>
                  </div>`;
                }).join('')}
              </div>
            </div>
          `;
        }

        // GEO trend
        let geoChartHTML = '';
        const geoScans = completedScans.filter(s => s.geo_score > 0);
        if (geoScans.length >= 2) {
          const maxGeo = Math.max(...geoScans.map(s => s.geo_score || 0), 100);
          geoChartHTML = `
            <div class="card">
              <h2 style="margin-bottom:16px;">GEO Score Trend</h2>
              <div style="display:flex;align-items:flex-end;gap:4px;height:150px;padding:0 8px;">
                ${geoScans.map(s => {
                  const h = Math.max((s.geo_score || 0) / maxGeo * 100, 4);
                  const color = (s.geo_score || 0) >= 80 ? '#22c55e' : (s.geo_score || 0) >= 50 ? '#f59e0b' : '#ef4444';
                  const date = new Date(s.scanned_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                  return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">
                    <span style="font-size:0.7rem;font-weight:700;color:${color};margin-bottom:2px;">${s.geo_score}</span>
                    <div style="width:100%;max-width:40px;height:${h}%;background:${color};border-radius:4px 4px 0 0;opacity:0.8;"></div>
                    <span style="font-size:0.6rem;color:#94a3b8;margin-top:4px;white-space:nowrap;">${date}</span>
                  </div>`;
                }).join('')}
              </div>
            </div>
          `;
        }

        // Scan table
        const tableRows = scans.map((s, idx) => {
          const score = s.score ?? '-';
          const geoScore = s.geo_score ?? '-';
          const scoreClass = typeof score === 'number' ? (score >= 80 ? 'score-good' : score >= 50 ? 'score-warn' : 'score-bad') : '';
          const geoClass = typeof geoScore === 'number' ? (geoScore >= 80 ? 'score-good' : geoScore >= 50 ? 'score-warn' : 'score-bad') : '';
          const date = new Date(s.scanned_at).toLocaleString();
          const prevScore = idx > 0 ? scans[idx - 1].score : null;
          let trend = '';
          if (prevScore !== null && typeof score === 'number') {
            const diff = score - prevScore;
            if (diff > 0) trend = `<span class="trend-up">↑ +${diff}</span>`;
            else if (diff < 0) trend = `<span class="trend-down">↓ ${diff}</span>`;
            else trend = `<span class="trend-same">—</span>`;
          }

          return `<tr>
            <td>${date}</td>
            <td><span class="badge badge-${s.status}">${s.status}</span></td>
            <td class="${scoreClass}">${score}</td>
            <td>${trend}</td>
            <td class="${geoClass}">${geoScore}</td>
            <td>${s.geo_band || '-'}</td>
          </tr>`;
        }).join('');

        document.getElementById('content').innerHTML = `
          ${chartHTML}
          ${geoChartHTML}
          <div class="card">
            <h2 style="margin-bottom:16px;">All Scans (${scans.length})</h2>
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Status</th>
                  <th>SEO Score</th>
                  <th>Trend</th>
                  <th>GEO Score</th>
                  <th>GEO Band</th>
                </tr>
              </thead>
              <tbody>${tableRows}</tbody>
            </table>
          </div>
        `;
      } catch (err) {
        console.error(err);
        document.getElementById('content').innerHTML = `
          <div class="empty">
            <h3>Failed to load scan history</h3>
            <p>Please try again later.</p>
          </div>`;
      }
    }

    document.getElementById('siteSelect').addEventListener('change', (e) => loadHistory(e.target.value));
    loadSites();
  </script>
</body>
</html>
