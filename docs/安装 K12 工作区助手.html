<!DOCTYPE html>
<!-- saved from url=(0026)https://sgk12.netlify.app/ -->
<html lang="zh-CN" data-immersive-translate-page-theme="dark"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>安装 K12 工作区助手</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: rgba(15, 23, 42, .74);
      --panel-2: rgba(255, 255, 255, .055);
      --border: rgba(148, 163, 184, .18);
      --border-2: rgba(45, 212, 191, .28);
      --text: #f8fafc;
      --muted: #94a3b8;
      --soft: #cbd5e1;
      --primary: #22c7b8;
      --primary-2: #0f766e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(20, 184, 166, .18), transparent 34rem),
        radial-gradient(circle at 50% 100%, rgba(45, 212, 191, .10), transparent 30rem),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(780px, 100%);
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: clamp(24px, 4vw, 42px);
      border: 1px solid var(--border);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .075), rgba(255, 255, 255, .035)),
        var(--panel);
      box-shadow: 0 30px 90px rgba(0, 0, 0, .34);
      backdrop-filter: blur(20px) saturate(1.15);
      -webkit-backdrop-filter: blur(20px) saturate(1.15);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 12% 0%, rgba(45, 212, 191, .16), transparent 32rem);
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid rgba(45, 212, 191, .22);
      border-radius: 999px;
      color: #5eead4;
      background: rgba(20, 184, 166, .08);
      font-size: 13px;
      font-weight: 700;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--primary);
      box-shadow: 0 0 0 4px rgba(34, 199, 184, .12);
    }

    h1 {
      margin: 16px 0 8px;
      font-size: clamp(34px, 5vw, 52px);
      line-height: 1.08;
      letter-spacing: -.04em;
    }

    .lead {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 16px;
    }

    .steps {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 0 0 18px;
    }

    .step {
      min-height: 150px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--panel-2);
    }

    .step-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 18px;
      font-weight: 850;
    }

    .num {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      border-radius: 999px;
      color: #052e2b;
      background: linear-gradient(135deg, #5eead4, #22c7b8);
      font-size: 16px;
      font-weight: 900;
    }

    .hint {
      margin: 0;
      color: var(--soft);
      font-size: 14px;
    }

    .shortcut {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    kbd {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(148, 163, 184, .22);
      border-radius: 999px;
      color: #e2e8f0;
      background: rgba(2, 6, 23, .32);
      font: 800 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .install {
      padding: 22px;
      border: 1px dashed rgba(45, 212, 191, .28);
      border-radius: 22px;
      background:
        radial-gradient(circle at center, rgba(20, 184, 166, .11), transparent 65%),
        rgba(2, 6, 23, .18);
      text-align: center;
    }

    .bookmarklet {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 0 34px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -.01em;
      cursor: grab;
      user-select: none;
      background:
        radial-gradient(circle at 30% 0%, rgba(255,255,255,.28), transparent 38%),
        linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 18px 38px rgba(20, 184, 166, .20);
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
    }

    .bookmarklet:hover {
      transform: translateY(-1px);
      filter: saturate(1.06) brightness(1.04);
      box-shadow: 0 22px 46px rgba(20, 184, 166, .26);
    }

    .status {
      max-width: 560px;
      margin: 14px auto 0;
      color: var(--muted);
      font-size: 14px;
    }

    .signature {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 16px;
      color: rgba(203, 213, 225, .78);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .01em;
    }

    .signature::before,
    .signature::after {
      content: "";
      width: 42px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(45, 212, 191, .42));
    }

    .signature::after {
      transform: scaleX(-1);
    }

    .signature-avatar {
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
      border: 1px solid rgba(45, 212, 191, .34);
      border-radius: 999px;
      object-fit: cover;
      box-shadow:
        0 0 0 3px rgba(45, 212, 191, .10),
        0 8px 18px rgba(0, 0, 0, .20);
    }

    @media (max-width: 760px) {
      body { place-items: start center; }
      .steps { grid-template-columns: 1fr; }
      .bookmarklet { width: 100%; }
    }
  </style>
</head>

</body><div id="immersive-translate-browser-popup" style="all: initial"><template shadowrootmode="open"><style>/** 基础色阶定义 **/
:root,
#mount[data-theme="light"],
#mount:not([data-theme="dark"]) {
  /* 中性灰阶（light） */
  --c-00: #000000;
  --c-22: #222222;
  --c-33: #333333;
  --c-66: #666666;
  --c-83: #838383;
  --c-99: #999999;
  --c-c7: #c7c7c7;
  --c-cc: #cccccc;
  --c-e6: #e6e6e6;
  --c-f5: #f5f5f5;
  --c-ff: #ffffff;
  /* 品牌主色阶（light） */
  --p-main: #ea4c89;
  --p-hover: #ec5e95;
  --p-active: #e34a85;
  --p-special: #ee71a2;
  --p-disabled: #f4a5c4;
  --p-text-disabled: #f9c9dc;
  --p-weak: #fdedf3;
  /* Surface 层级（light，TC 填充-1） */
  --s-1: #f3f5f6;
  --s-1-hover: #f6f8f9;
  --s-1-active: #edf1f2;
  --s-1-weak: #fafbfb;
  /* 输入/边框（light，TC 填充-2） */
  --input-bg-base: #fafbfc;
  --input-border: #ecf0f7;
  --input-border-strong: #e0e0e6;
  --input-bg-strong: #fafdff;
}

:root[data-theme="dark"],
[data-theme="dark"] {
  /* 中性灰阶（dark） */
  --c-00: #ffffff;
  --c-22: #dbdbdb;
  --c-33: #dbdbdb;
  --c-66: #b3b3b3;
  --c-83: #838383;
  --c-99: #707070;
  --c-c7: #666666;
  --c-cc: #5c5c5c;
  --c-e6: #3b3b3b;
  --c-f5: #262626;
  --c-ff: #222222;
  /* 品牌主色阶（dark） */
  --p-main: #e23c7c;
  --p-hover: #ea4c89;
  --p-active: #d5467d;
  --p-special: #a93a65;
  --p-disabled: #7e2f4d;
  --p-text-disabled: #522335;
  --p-weak: #26171d;

  --input-bg-strong: #1f2123;
}
